
services:
  - type: web
    name: linkscope
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_ENCRYPTION_KEY
        sync: false
      - key: SESSION_KEY_TTL_SECONDS
        value: 86400
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
